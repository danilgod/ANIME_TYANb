<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Отмой грязнульку</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#120d14;overflow:hidden;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
  body{display:grid;place-items:center}
  #stage{
    width:min(100vw, 75vh);
    height:auto;
    display:block;
    touch-action:manipulation;
    user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #girlInner{animation:bob 4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

  .dirt{transition:opacity .3s ease;pointer-events:none}

  .hit{fill:rgba(255,255,255,0);stroke:rgba(255,255,255,0);cursor:pointer;
       transition:fill .15s ease,stroke .15s ease}
  .hit:hover{fill:rgba(255,255,255,.10)}
  .hit.err{fill:rgba(255,60,90,.25);stroke:#ff3c5a;stroke-width:5;stroke-dasharray:10 8}

  [data-item].off{display:none}

  .tool,.card,.cat,.tab{cursor:pointer}
  .tool .inner{transition:transform .2s ease}
  .tool .slotbg{fill:rgba(255,255,255,.05);stroke:rgba(255,255,255,.14);stroke-width:2;
                transition:fill .2s,stroke .2s}
  .tool:hover .slotbg{fill:rgba(255,255,255,.10)}
  .tool.sel .slotbg{fill:rgba(255,207,92,.14);stroke:#ffcf5c;stroke-width:4}
  .tool.sel .inner{transform:translateY(-8px) scale(1.06)}

  .card .bg{fill:rgba(255,255,255,.05);stroke:rgba(255,255,255,.14);stroke-width:2;
            transition:fill .18s,stroke .18s}
  .card:hover .bg{fill:rgba(255,255,255,.10)}
  .card.on .bg{fill:rgba(255,143,187,.16);stroke:#ff8fbb;stroke-width:3}
  .card .tag{opacity:0;transition:opacity .18s}
  .card.on .tag{opacity:1}

  .cat rect{fill:rgba(255,255,255,.05);stroke:rgba(255,255,255,.12);stroke-width:1.5;
            transition:fill .18s}
  .cat:hover rect{fill:rgba(255,255,255,.10)}
  .cat.on rect{fill:#ff8fbb;stroke:#ff8fbb}
  .cat.on text{fill:#2a1220}

  .tab rect{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.14);stroke-width:1.5;
            transition:fill .18s}
  .tab.on rect{fill:#ff8fbb;stroke:#ff8fbb}
  .tab.on text{fill:#2a1220}

  #toast{opacity:0;transition:opacity .25s ease}
  #toast.show{opacity:1}

  #win{opacity:0;pointer-events:none;transition:opacity .4s ease}
  #win.show{opacity:1;pointer-events:auto}
  #win .card2{transform-box:fill-box;transform-origin:center;transform:scale(.85);
              transition:transform .4s cubic-bezier(.2,1.4,.5,1)}
  #win.show .card2{transform:scale(1)}

  .clean .blush{opacity:.5}
  .clean .lips{fill:#e08fa2}
  .clean .happyEyes{opacity:1}
  .clean .baseEyes{opacity:0}
  .clean .aura{opacity:1}
  .aura{opacity:0;transition:opacity .8s ease}
</style>
</head>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const stage = document.getElementById('stage');

  /* ---------- данные ---------- */

  ];
  const WARDROBE = {
    top: { name: 'Верх', items: [
      { id: 'tee',     name: 'Майка с черепом' },
      { id: 'hoodie',  name: 'Худи оверсайз' },
      { id: 'mesh',    name: 'Сетка' },
    ]},
    bottom: { name: 'Низ', items: [
      { id: 'plaid',   name: 'Юбка в клетку' },
      { id: 'leather', name: 'Кожаная мини' },
      { id: 'shorts',  name: 'Джинсовые шорты' },
    ]},
    tights: { name: 'Ноги', items: [
      { id: 'fishnet', name: 'Сетчатые' },
      { id: 'ripped',  name: 'Рваные' },
    ]},
    shoes: { name: 'Обувь', items: [
      { id: 'boots',    name: 'Платформы' },
      { id: 'sneakers', name: 'Кеды' },
    ]},
  };
  const state = {
    top: 'tee', bottom: 'plaid', tights: 'fishnet', shoes: 'boots',
    mode: 'wash', cat: 'top',
  };

  /* ---------- состояние игры ---------- */
  let selectedTool = null;
  let cleaned = 0;
  let total = 0;
  let clicks = 0;
  let done = false;
  let muted = false;
  let toastTimer = null;
  let dressHint = false;
  let wardrobeHinted = false;

  const dirt = {};
  document.querySelectorAll('.dirt').forEach(el => {
    const z = el.dataset.zone;
    (dirt[z] = dirt[z] || []).push(el);
    total++;
  });

  /* ---------- звук ---------- */
  let ac = null;
  function beep(freq, dur, type = 'sine', vol = .05, to = null) {
    if (muted) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.value = freq;
      if (to) o.frequency.exponentialRampToValueAtTime(to, ac.currentTime + dur);
      g.gain.value = vol;
      g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
      o.connect(g).connect(ac.destination);
      o.start();
      o.stop(ac.currentTime + dur);
    } catch (e) { /* тишина */ }
  }

  /* ---------- утилиты ---------- */
  function svgPoint(evt) {
    const p = stage.createSVGPoint();
    p.x = evt.clientX; p.y = evt.clientY;
    return p.matrixTransform(stage.getScreenCTM().inverse());
  }
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1700);
  }
  function burst(x, y, color) {
    for (let i = 0; i < 9; i++) {
      const c = document.createElementNS(NS, 'circle');
      const r = 3 + Math.random() * 5;
      c.setAttribute('r', r);
      c.setAttribute('fill', color);
      c.setAttribute('cx', x); c.setAttribute('cy', y);
      fx.appendChild(c);
      const a = Math.random() * Math.PI * 2, d = 35 + Math.random() * 80;
      c.animate([
        { transform: 'translate(0px,0px)', opacity: 1 },
        { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px)`, opacity: 0 }
      ], { duration: 450 + Math.random() * 350, easing: 'ease-out' })
        .onfinish = () => c.remove();
    }
  }
  function star(x, y, size, delay) {
    const s = document.createElementNS(NS, 'path');
    s.setAttribute('d',
      `M${x} ${y - size} L${x + size * .26} ${y - size * .26} L${x + size} ${y} ` +
      `L${x + size * .26} ${y + size * .26} L${x} ${y + size} ` +
      `L${x - size * .26} ${y + size * .26} L${x - size} ${y} ` +
      `L${x - size * .26} ${y - size * .26} Z`);
    s.setAttribute('fill', '#fff3b0');
    s.style.opacity = 0;
    fx.appendChild(s);
    s.animate([
      { opacity: 0, transform: 'scale(0) rotate(0deg)' },
      { opacity: 1, transform: 'scale(1) rotate(90deg)', offset: .3 },
      { opacity: 1, transform: 'scale(.9) rotate(140deg)', offset: .6 },
      { opacity: 0, transform: 'scale(.2) rotate(200deg)' }
    ], { duration: 1800, delay, easing: 'ease-in-out' })
      .onfinish = () => s.remove();
  }

  /* ---------- прогресс ---------- */
  function updateBar() {
    const p = Math.round(cleaned / total * 100);
    bar.setAttribute('width', Math.max(0, 494 * p / 100));

    hintEl.textContent = p < 100 ? `${total - cleaned} слоёв грязи` : 'чисто!';
  }

  /* ---------- иконки ---------- */

  function itemIcon(id) {
    switch (id) {
      case 'tee': return `

  /* ---------- рендер панели ---------- */
  function renderTools() {
    toolsRow.innerHTML = '';
    TOOLS.forEach((t, i) => {
      const g = document.createElementNS(NS, 'g');

      g.innerHTML = `
        <rect class="slotbg" x="-72" y="-60" width="144" height="122" rx="16"/>
        <g class="inner" transform="translate(0,-8)">${toolIcon(t.icon)}</g>
        <text y="50" text-anchor="middle" font-size="14" font-weight="600" fill="#eadfe6"
              font-family="'Segoe UI',system-ui,sans-serif">${t.name}</text>`;
      g.addEventListener('click', () => selectTool(g));
      toolsRow.appendChild(g);
    });
  }

  function renderCats() {
    catsG.innerHTML = '';
    Object.keys(WARDROBE).forEach((key, i) => {
      const g = document.createElementNS(NS, 'g');
      g.setAttribute('class', 'cat' + (state.cat === key ? ' on' : ''));
      g.setAttribute('transform', `translate(12,${1062 + i * 34})`);
      const fill = state.cat === key ? '#2a1220' : '#d7c9d2';
      g.innerHTML = `
        <rect x="0" y="0" width="126" height="30" rx="15"/>
        <text x="63" y="20" text-anchor="middle" font-size="13" font-weight="600"
              fill="${fill}" font-family="'Segoe UI',system-ui,sans-serif">${WARDROBE[key].name}</text>`;
      g.addEventListener('click', () => {
        state.cat = key;
        renderCats(); renderCards();
        beep(520, .06, 'sine', .03);
      });
      catsG.appendChild(g);
    });
  }

  function renderCards() {
    cardsG.innerHTML = '';
    const cat = state.cat;
    WARDROBE[cat].items.forEach((it, i) => {
      const on = state[cat] === it.id;
      const g = document.createElementNS(NS, 'g');
      g.setAttribute('class', 'card' + (on ? ' on' : ''));
      g.setAttribute('transform', `translate(${320 + i * 200},1116)`);
      g.innerHTML = `
        <rect class="bg" x="-88" y="-56" width="176" height="112" rx="16"/>
        <circle cx="0" cy="-12" r="31" fill="rgba(255,255,255,.08)"/>
        <g transform="translate(0,-12)">${itemIcon(it.id)}</g>
        <text y="40" text-anchor="middle" font-size="13" font-weight="600" fill="#eadfe6"
              font-family="'Segoe UI',system-ui,sans-serif">${it.name}</text>
        <g class="tag">
          <rect x="26" y="-52" width="56" height="20" rx="10" fill="#ff8fbb"/>
          <text x="54" y="-38" text-anchor="middle" font-size="11" font-weight="700"
                fill="#2a1220" font-family="'Segoe UI',system-ui,sans-serif">надето</text>
        </g>`;
      g.addEventListener('click', () => toggleItem(cat, it.id));
      cardsG.appendChild(g);
    });
  }

  /* ---------- одежда ---------- */
  function applyWardrobe() {
    document.querySelectorAll('[data-item]').forEach(el => {
      const id = el.dataset.item;
      let on = false;
      Object.keys(WARDROBE).forEach(k => {
        if (WARDROBE[k].items.some(i => i.id === id)) on = (state[k] === id);
      });
      el.classList.toggle('off', !on);
    });
  }

  function toggleItem(cat, id) {
    if (done) return;
    const was = state[cat];
    state[cat] = (was === id) ? null : id;
    applyWardrobe();
    renderCards();
    if (was === id) {
      toast('Снято 🖤');
      beep(420, .1, 'sine', .04, 300);
    } else {
      toast('Надето ✨');
      beep(660, .1, 'triangle', .04, 900);
    }
    checkWin();
  }

  /* ---------- режимы ---------- */
  function setMode(mode) {
    state.mode = mode;
    document.querySelectorAll('.tab').forEach(t =>
      t.classList.toggle('on', t.dataset.mode === mode));
    toolsRow.style.display = mode === 'wash' ? '' : 'none';
    wardRow.style.display = mode === 'wardrobe' ? '' : 'none';
    if (mode === 'wardrobe') {
      renderCats(); renderCards();
      if (!wardrobeHinted) {
        wardrobeHinted = true;
        toast('Нажми на надетую вещь, чтобы снять её');
      }
    }
  }

  /* ---------- выбор средства ---------- */
  function selectTool(g) {
    if (done) return;
    selectedTool = (selectedTool === g) ? null : g;
    document.querySelectorAll('.tool').forEach(t =>
      t.classList.toggle('sel', t === selectedTool));
  }

  /* ---------- клик по зоне ---------- */
  const toolName = {
    face: 'Мицелярка', hair: 'Шампунь', hands: 'Губка', legs: 'Мочалка'
  };

  document.querySelectorAll('.hit').forEach(hit => {
    hit.addEventListener('click', evt => {
      if (done) return;
      const zone = hit.dataset.zone;
      const p = svgPoint(evt);
      clicks++;

      if (zone === 'torso') {
        setMode('wardrobe');
        toast('Тут можно переодеться 👗');
        beep(520, .08, 'sine', .03);
        return;
      }

      if (!selectedTool) {
        toast('Сначала возьми средство внизу 🧴');
        return;
      }
      if (selectedTool.dataset.zone !== zone) {
        hit.classList.add('err');
        setTimeout(() => hit.classList.remove('err'), 420);
        toast(`${toolName[selectedTool.dataset.zone]} тут не поможет 🙈`);
        beep(160, .16, 'sawtooth', .05, 90);
        return;
      }

      const list = dirt[zone];
      if (!list || !list.length) {
        toast('Тут уже чисто ✨');
        return;
      }

      const el = list.shift();
      el.style.opacity = 0;
      cleaned++;
      updateBar();
      burst(p.x, p.y, zone === 'face' ? '#ffd1e3' : '#ffe6a8');
      beep(680, .12, 'triangle', .05, 1500);

      if (!list.length) setTimeout(() => burst(p.x, p.y, '#ffffff'), 130);
      checkWin();
    });
  });

  /* ---------- победа ---------- */
  function checkWin() {
    if (done) return;
    const dressed = !!(state.top && state.bottom && state.shoes);
    if (cleaned >= total && dressed) { win(); return; }
    if (cleaned >= total && !dressed && !dressHint) {
      dressHint = true;
      toast('Чистая! Осталось одеться 👗');
      setMode('wardrobe');
    }
  }

  function win() {
    done = true;
    stage.classList.add('clean');
    document.querySelectorAll('.tool').forEach(t => t.classList.remove('sel'));
    selectedTool = null;

    winSub.textContent = `${clicks} кликов — и она сияет ✨`;
    winEl.classList.add('show');

    beep(880, .12, 'sine', .06);
    setTimeout(() => beep(1180, .16, 'sine', .06), 130);
    setTimeout(() => beep(1560, .22, 'sine', .05), 280);

    for (let i = 0; i < 18; i++) {
      star(240 + Math.random() * 420, 190 + Math.random() * 620, 8 + Math.random() * 14, i * 45);
    }
  }

  /* ---------- заново ---------- */
  again.addEventListener('click', () => {
    document.querySelectorAll('.dirt').forEach(el => el.style.opacity = '');
    Object.assign(state, { top: 'tee', bottom: 'plaid', tights: 'fishnet', shoes: 'boots' });
    document.querySelectorAll('.tool').forEach(t => t.classList.remove('sel'));
    document.querySelectorAll('.hit').forEach(h => h.classList.remove('err'));
    selectedTool = null;
    done = false;
    clicks = 0;
    cleaned = 0;
    dressHint = false;
    stage.classList.remove('clean');
    winEl.classList.remove('show');
    setMode('wash');
    applyWardrobe();
    updateBar();
    toast('Погнали заново 💅');
  });

  /* ---------- звук ---------- */
  document.getElementById('snd').addEventListener('click', () => {
    muted = !muted;
    document.getElementById('sndIcon').textContent = muted ? '🔇' : '🔊';
  });

  /* ---------- табы ---------- */
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      setMode(t.dataset.mode);
      beep(520, .06, 'sine', .03);
    });
  });

  /* ---------- старт ---------- */
  renderTools();
  renderCats();
  renderCards();
  applyWardrobe();
  setMode('wash');
  updateBar();
  toast('Сними грязное и отмой её 💅');
})();
</script>
</body>
</html>
